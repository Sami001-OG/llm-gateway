<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Gateway · Control Center</title>
<style>
/* One restrained system: tinted neutrals + a single mint accent. No violet. */
:root{
  --bg:oklch(0.155 0.014 245);
  --bg-elev:oklch(0.200 0.018 245);
  --surface:oklch(0.225 0.020 245);
  --surface-2:oklch(0.255 0.021 245);
  --border:oklch(0.325 0.020 245);
  --border-strong:oklch(0.420 0.024 245);
  --text:oklch(0.965 0.008 245);
  --text-2:oklch(0.825 0.012 245);
  --muted:oklch(0.680 0.016 245);
  --accent:oklch(0.845 0.125 168);
  --accent-soft:oklch(0.300 0.050 168);
  --accent-ink:oklch(0.160 0.030 168);
  --danger:oklch(0.720 0.150 22);
  --warn:oklch(0.830 0.120 78);
  --ok:oklch(0.830 0.125 155);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --shadow:0 12px 32px -8px oklch(0 0 0 / .55), 0 2px 6px -2px oklch(0 0 0 / .35);
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:13px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.tabular{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.ico{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* Lock / sign-in */
.lock{position:fixed;inset:0;background:oklch(0.10 0.012 245 / .82);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:20px}
.lock-card{width:min(400px,100%);background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:30px;box-shadow:var(--shadow)}
.lock-card h1{margin:16px 0 6px;font-size:20px;letter-spacing:-.02em}
.lock-card p{margin:0 0 22px;color:var(--muted)}
.brandmark{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);border:1px solid oklch(0.45 0.09 168);display:grid;place-items:center;color:var(--accent)}

/* Shell */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex:0 0 236px;background:var(--bg-elev);border-right:1px solid var(--border);padding:22px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;font-weight:650;font-size:14px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-size:13px;transition:background 150ms var(--ease-out),color 150ms var(--ease-out)}
.nav button:hover{background:var(--surface);color:var(--text)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent);border-color:oklch(0.42 0.08 168 / .5)}
.nav .label{flex:1}
.nav .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px 11px;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:11px;line-height:1.7}
.side-foot b{color:var(--text-2);font-weight:600}
main{flex:1;min-width:0;padding:28px 34px 72px;max-width:1440px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
h1.page{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:650}
.sub{margin:4px 0 0;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;align-items:center}
.livepill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:11px}
.livepill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px oklch(0.83 0.125 155 / .12)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;transition:transform 150ms var(--ease-out),background 150ms var(--ease-out),border-color 150ms var(--ease-out)}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:oklch(0.89 0.125 168);border-color:oklch(0.89 0.125 168)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--danger);border-color:oklch(0.72 0.15 22 / .35)}
.btn.sm{padding:5px 9px;font-size:11px;border-radius:7px}
.btn.icon{padding:6px;width:30px;height:30px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.card h2{margin:0 0 16px;font-size:14px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;gap:12px}
.sectionhead h2{margin:0;font-size:14px;font-weight:650}
.metric{display:flex;flex-direction:column;gap:5px}
.metric .n{font-size:26px;font-weight:660;letter-spacing:-.03em;line-height:1.1}
.metric .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.metric .meter{height:3px;border-radius:99px;background:oklch(0.33 0.02 245);margin-top:8px;overflow:hidden}
.metric .meter>i{display:block;height:100%;background:var(--accent)}
.note{margin-top:14px;padding:10px 12px;border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:0 8px 8px 0;background:var(--bg-elev);color:var(--text-2);font-size:11.5px;line-height:1.6}
code.inline{background:var(--bg-elev);border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:11px}

/* Tabs (no animation - keyboard/pointer switching happens constantly) */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:6px 11px;font-size:12px;color:var(--muted);transition:background 150ms var(--ease-out),color 150ms var(--ease-out)}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-selected=true]{background:var(--accent-soft);border-color:oklch(0.42 0.08 168 / .5);color:var(--accent)}
.tab .tcount{color:var(--muted);font-size:11px;margin-left:3px}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{display:table;width:100%;table-layout:auto;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-elev)}
td{padding:10px 12px;border-bottom:1px solid oklch(0.30 0.018 245);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background 150ms var(--ease-out)}
tbody tr:hover{background:var(--surface-2)}
.actions{display:flex;gap:4px;justify-content:flex-end}
.handle{cursor:grab;color:var(--muted);width:20px;text-align:center;user-select:none}
tr.dragging{opacity:.35}
tr.dragover td{border-top:2px solid var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:650;border:1px solid var(--border);white-space:nowrap;color:var(--muted)}
.badge.ok{color:var(--ok);background:oklch(0.83 0.125 155 / .08);border-color:oklch(0.83 0.125 155 / .25)}
.badge.cool{color:var(--warn);background:oklch(0.83 0.12 78 / .08);border-color:oklch(0.83 0.12 78 / .25)}
.badge.off{color:var(--danger);background:oklch(0.72 0.15 22 / .08);border-color:oklch(0.72 0.15 22 / .25)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;background:var(--accent-soft);border:1px solid oklch(0.42 0.08 168 / .4);color:var(--accent);font-size:11px;font-weight:600;margin:2px}
.provider{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:oklch(0.83 0.12 78 / .08);color:var(--warn);border:1px solid oklch(0.83 0.12 78 / .22)}
.provider.openai{background:oklch(0.83 0.125 155 / .08);color:var(--ok);border-color:oklch(0.83 0.125 155 / .22)}
.empty{padding:36px 16px;text-align:center;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-size:12px}
.empty b{display:block;color:var(--text-2);font-weight:600;font-size:13px;margin-bottom:4px}

/* Pools */
.poolcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);text-align:left;transition:transform 180ms var(--ease-out),border-color 180ms var(--ease-out)}
.poolcard:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.poolcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.poolcard h3{margin:0;font-size:13px;font-weight:650;letter-spacing:-.01em}
.poolcard .m{color:var(--muted);font-size:11px;margin-top:7px}
.poolcard .meter{height:3px;background:oklch(0.33 0.02 245);border-radius:99px;margin-top:12px;overflow:hidden}
.poolcard .meter>i{display:block;height:100%;background:var(--accent)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;color:var(--text-2);font-weight:600}
input,select,textarea{background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:9px 11px;outline:none;width:100%;caret-color:var(--accent);transition:border-color 150ms var(--ease-out),box-shadow 150ms var(--ease-out)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px oklch(0.845 0.125 168 / .12)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:132px;resize:vertical}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{max-width:320px}

/* Modal: centered, origin center, enter from .96 + opacity (never scale(0)) */
.overlay{position:fixed;inset:0;background:oklch(0.09 0.010 245 / .72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:20px;opacity:1;transition:opacity 180ms var(--ease-out)}
.overlay[data-starting-style],.overlay[data-ending-style]{opacity:0}
.modal{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:14px;padding:22px 24px;box-shadow:0 24px 64px -12px oklch(0 0 0 / .65);transform:scale(1);opacity:1;transition:transform 220ms var(--ease-out),opacity 180ms var(--ease-out)}
.overlay[data-starting-style] .modal,.overlay[data-ending-style] .modal{transform:scale(.96);opacity:0}
.modal h2{margin:0 0 18px;font-size:16px;letter-spacing:-.015em}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.preset{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:1px solid var(--border);background:var(--surface);border-radius:9px;text-align:left;margin-bottom:7px;transition:transform 150ms var(--ease-out),border-color 150ms var(--ease-out)}
.preset:hover{transform:translateY(-1px);border-color:var(--accent)}
.preset .dotmark{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.preset .nm{font-weight:600;font-size:12px}
.preset .hint{color:var(--muted);font-size:11px}

/* Toasts: interruptible transitions, not keyframes */
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:9px;min-width:250px;max-width:380px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:10px 13px;box-shadow:var(--shadow);font-size:12px;opacity:1;transform:translateY(0);transition:opacity 400ms ease,transform 400ms ease}
.toast[data-starting-style],.toast[data-ending-style]{opacity:0;transform:translateY(12px)}
.toast.err{border-color:oklch(0.72 0.15 22 / .5)}
.toast.ok{border-color:oklch(0.83 0.125 155 / .45)}
.toast .msg{flex:1}
.codeblock{background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:11px 12px;font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-2)}
.loading{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:8px 0}
.spin{width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.sidebar{width:64px;flex-basis:64px;padding:16px 8px}.brand span:last-child,.nav .label,.nav .count,.side-foot{display:none}.brand{justify-content:center;padding:0 0 20px}.nav button{justify-content:center;padding:10px}main{padding:20px 18px 60px}.g4,.g3,.g2{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}.top-actions{width:100%}.top-actions .btn{flex:1}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-property:opacity,color,background-color,border-color!important;transition-duration:120ms!important}
  .spin{animation:none;border-top-color:var(--accent);border-style:solid}
}
</style>
</head>
<body>

<div class="lock" id="lock">
  <form class="lock-card" id="loginForm">
    <div class="brandmark"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg></div>
    <h1>Gateway Control Center</h1>
    <p>Enter an admin token from <code class="inline">server.admin_tokens</code>.</p>
    <div class="field"><label for="loginToken">Admin token</label><input id="loginToken" type="password" autocomplete="current-password" placeholder="change-me-admin-token" autofocus></div>
    <button class="btn primary" style="width:100%" type="submit">Unlock</button>
  </form>
</div>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brandmark"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 8v8l9 5 9-5V8"/></svg></span>
      <span>Gateway</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <header class="topbar">
      <div><h1 class="page" id="pageTitle">Overview</h1><p class="sub" id="pageSub">Live status of your account pool</p></div>
      <div class="top-actions">
        <span class="livepill"><span class="dot"></span><span id="liveText">Live</span></span>
        <button class="btn quiet" id="reloadBtn">Reload from disk</button>
        <button class="btn" id="refreshBtn">Refresh</button>
      </div>
    </header>
    <section id="view-overview"></section>
    <section id="view-accounts" class="hidden"></section>
    <section id="view-endpoints" class="hidden"></section>
    <section id="view-tokens" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
    <section id="view-remote" class="hidden"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const I={
  overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  accounts:'<circle cx="8" cy="8" r="4"/><path d="M2 21a6 6 0 0 1 12 0"/><path d="M16 4.5a4 4 0 0 1 0 7"/><path d="M18 15a6 6 0 0 1 4 6"/>',
  endpoints:'<path d="M4 7h10"/><path d="M11 4l3 3-3 3"/><path d="M20 17H10"/><path d="M13 14l-3 3 3 3"/>',
  tokens:'<path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-3v-.1A1.7 1.7 0 0 0 10.8 19a1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1A1.7 1.7 0 0 0 7.2 15a1.7 1.7 0 0 0-1.6-1H5v-3h.1A1.7 1.7 0 0 0 7 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-2 .1.1A1.7 1.7 0 0 0 10.6 6a1.7 1.7 0 0 0 1-1.6V4h3v.1A1.7 1.7 0 0 0 15.6 6a1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1A1.7 1.7 0 0 0 19.2 10a1.7 1.7 0 0 0 1.6 1H21v3h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  remote:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.7 5.7 3.7 9S14.5 18.3 12 21c-2.5-2.7-3.7-5.7-3.7-9S9.5 5.7 12 3Z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/>',
  up:'<path d="m6 15 6-6 6 6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  power:'<path d="M12 3v9"/><path d="M6.2 6.2a8 8 0 1 0 11.6 0"/>',
  trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
  check:'<path d="m5 12 4 4L19 6"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  arrow:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/>'
};
const icon=(n,c='ico')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]||''}</svg>`;
const VIEWS=[['overview','Overview'],['accounts','Accounts'],['endpoints','Endpoints'],['tokens','API Tokens'],['settings','Settings'],['remote','Remote access']];
const TITLES={overview:'Live status of your account pool',accounts:'Add, order and manage every credential',endpoints:'Choose which pools serve each model alias',tokens:'Create keys for clients and administrators',settings:'Gateway behaviour and cooldown tuning',remote:'Use the gateway from another device'};
let token=localStorage.getItem('gw_admin_token')||'',S=null,view='overview',currentPool=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg,kind=''){
  const el=document.createElement('div');el.className='toast '+(kind==='err'?'err':kind==='ok'?'ok':'');
  el.innerHTML=`${icon(kind==='err'?'x':kind==='ok'?'check':'layers')}<span class="msg">${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  requestAnimationFrame(()=>el.removeAttribute('data-starting-style'));
  setTimeout(()=>{el.setAttribute('data-ending-style','');setTimeout(()=>el.remove(),400)},3800);
}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}});
  if(r.status===401){showLock();throw new Error('Session expired')}
  let j;try{j=await r.json()}catch{j={}}
  if(!r.ok||j.ok===false)throw new Error(j.error||('Request failed ('+r.status+')'));
  return j.data;
}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
function showLock(){$('#lock').classList.remove('hidden');$('#app').classList.add('hidden')}
function busy(btn,on){if(!btn)return;btn.disabled=on;btn.style.opacity=on?'.55':'';}

async function refresh(){
  try{
    S=await api('/admin/ui/state');
    $('#lock').classList.add('hidden');$('#app').classList.remove('hidden');
    localStorage.setItem('gw_admin_token',token);
    if(!currentPool||!S.pools.some(p=>p.name===currentPool))currentPool=S.pools[0]?.name||null;
    renderNav();renderAll();
  }catch(e){if(e.message!=='Session expired')toast(e.message,'err')}
}
async function doReload(btn){busy(btn,true);try{await post('/admin/ui/reload');toast('Configuration reloaded','ok');await refresh()}catch(e){toast(e.message,'err')}finally{busy(btn,false)}}

function renderNav(){
  $('#nav').innerHTML=VIEWS.map(([v,label])=>`<button data-view="${v}" ${v===view?'aria-current="page"':''} title="${label}">
    ${icon(v)}<span class="label">${label}</span>${v==='accounts'?`<span class="count">${S.stats.keys}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>navTo(b.dataset.view));
  $('#sideFoot').innerHTML=`<b>${S.pools.length}</b> pools &nbsp;·&nbsp; <b>${S.stats.keys}</b> accounts<br>${esc(S.server.config_path||'no config path')}`;
}
function navTo(v){
  view=v;renderNav();
  VIEWS.forEach(([x])=>$('#view-'+x).classList.toggle('hidden',x!==v));
  $('#pageTitle').textContent=VIEWS.find(x=>x[0]===v)[1];$('#pageSub').textContent=TITLES[v];
  renderAll();
}
function renderAll(){if(!S)return;renderOverview();renderAccounts();renderEndpoints();renderTokens();renderSettings();renderRemote()}

function badge(k){
  if(k.disabled)return '<span class="badge off">Disabled</span>';
  if(!k.available&&k.cooldown_remaining>0)return `<span class="badge cool">Cooling ${k.cooldown_remaining}s</span>`;
  return '<span class="badge ok">Ready</span>';
}
function meter(n,total){return `<div class="meter"><i style="width:${total?Math.round(n/total*100):0}%"></i></div>`}

function renderOverview(){
  const st=S.stats;
  let h=`<div class="grid g4">
    <div class="card metric"><span class="n tabular">${st.keys}</span><span class="l">Accounts</span>${meter(st.keys,Math.max(st.keys,1))}</div>
    <div class="card metric"><span class="n tabular">${st.available}</span><span class="l">Available</span>${meter(st.available,Math.max(st.keys,1))}</div>
    <div class="card metric"><span class="n tabular">${st.cooling_down}</span><span class="l">Cooling down</span>${meter(st.cooling_down,Math.max(st.keys,1))}</div>
    <div class="card metric"><span class="n tabular">${st.requests}</span><span class="l">Requests routed</span>${meter(st.successes,Math.max(st.requests,1))}</div>
  </div><div class="sectionhead"><h2>Pools</h2><button class="btn sm" data-nav="accounts">Manage accounts ${icon('arrow')}</button></div><div class="grid g3">`;
  S.pools.forEach(p=>{const ready=p.keys.filter(k=>k.available&&!k.disabled).length;
    h+=`<button class="poolcard" data-pool="${esc(p.name)}"><div class="top"><h3>${esc(p.name)}</h3><span class="provider ${p.provider}">${p.provider}</span></div>
    <div class="m">${ready} of ${p.keys.length} ready · ${p.models.length} models</div>${meter(ready,Math.max(p.keys.length,1))}</button>`});
  h+=`</div><div class="sectionhead"><h2>Model routes</h2><button class="btn sm" data-nav="endpoints">Edit endpoints ${icon('arrow')}</button></div>
  <div class="tablewrap"><table><thead><tr><th>Alias</th><th>Served by, in order</th><th>Upstream override</th></tr></thead><tbody>`;
  Object.entries(S.routes).forEach(([a,r])=>{h+=`<tr><td><b>${esc(a)}</b></td><td>${r.pools.map(p=>`<span class="chip">${esc(p)}</span>`).join('<span style="color:var(--muted)">→</span>')}</td><td class="mono">${esc(r.model||'auto')}</td></tr>`});
  h+=`</tbody></table></div>`;
  $('#view-overview').innerHTML=h;
  $('#view-overview').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navTo(b.dataset.nav));
  $('#view-overview').querySelectorAll('[data-pool]').forEach(b=>b.onclick=()=>{currentPool=b.dataset.pool;navTo('accounts')});
}

function renderAccounts(){
  const p=S.pools.find(x=>x.name===currentPool);
  let h=`<div class="tabs">${S.pools.map(x=>`<button class="tab" data-pool="${esc(x.name)}" aria-selected="${x.name===currentPool}">${esc(x.name)}<span class="tcount">${x.keys.length}</span></button>`).join('')}
    <button class="tab" id="quickAdd">${icon('plus')} Quick add provider</button></div>
    <div class="card"><h2>Accounts in ${esc(currentPool||'—')}<button class="btn sm primary" id="addKeys">${icon('plus')} Add accounts</button></h2>`;
  if(!p){h+=`<div class="empty"><b>No pool selected</b>Add a provider with Quick add, or define one in config.yaml.</div>`}
  else{
    h+=`<div class="tablewrap"><table><thead><tr><th style="width:30px"></th><th>Credential</th><th>Status</th><th>Requests</th><th class="tabular">OK / Fail</th><th style="text-align:right">Actions</th></tr></thead><tbody id="keyRows">`;
    p.keys.forEach(k=>{h+=`<tr draggable="true" data-id="${esc(k.id)}">
      <td class="handle" title="Drag to reorder">⋮⋮</td><td class="mono">${esc(k.masked)}</td><td>${badge(k)}</td>
      <td class="tabular">${k.total_requests}</td><td class="tabular"><span style="color:var(--ok)">${k.total_successes}</span> / <span style="color:var(--danger)">${k.total_failures}</span></td>
      <td><div class="actions">
        <button class="btn icon quiet" data-act="up" data-id="${esc(k.id)}" title="Move up" aria-label="Move up">${icon('up')}</button>
        <button class="btn icon quiet" data-act="down" data-id="${esc(k.id)}" title="Move down" aria-label="Move down">${icon('down')}</button>
        <button class="btn icon quiet" data-act="toggle" data-id="${esc(k.id)}" data-val="${!k.disabled}" title="${k.disabled?'Enable':'Disable'}" aria-label="${k.disabled?'Enable':'Disable'}">${icon('power')}</button>
        <button class="btn icon quiet danger" data-act="remove" data-id="${esc(k.id)}" title="Remove" aria-label="Remove">${icon('trash')}</button>
      </div></td></tr>`});
    h+=`</tbody></table></div><div class="note">Drag rows or use the arrows to set priority. Selection strategy is <b>${esc(p.selection)}</b>; disabled and cooling accounts are skipped automatically.</div>`;
  }
  h+=`</div>`;
  $('#view-accounts').innerHTML=h;
  $('#view-accounts').querySelectorAll('[data-pool]').forEach(b=>b.onclick=()=>{currentPool=b.dataset.pool;renderAccounts()});
  $('#view-accounts').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>keyAction(b.dataset.act,b.dataset.id,b.dataset.val));
  const add=$('#addKeys');if(add)add.onclick=addKeysModal;
  const qa=$('#quickAdd');if(qa)qa.onclick=quickAddModal;
  wireDrag();
}
function keyAction(act,id,val){
  if(act==='up'||act==='down'){
    const o=S.pools.find(p=>p.name===currentPool).keys.map(k=>k.id),i=o.indexOf(id),j=i+(act==='up'?-1:1);
    if(i<0||j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];
    post('/admin/ui/keys/reorder',{pool:currentPool,order:o}).then(refresh).catch(e=>toast(e.message,'err'));
  }else if(act==='toggle'){
    post('/admin/ui/keys/toggle',{pool:currentPool,key_id:id,disabled:val==='true'}).then(()=>toast(val==='true'?'Account disabled':'Account enabled','ok')).catch(e=>toast(e.message,'err'));
  }else if(act==='remove'){
    confirmModal('Remove account',`Remove ${id} from config.yaml? This cannot be undone.`,
      btn=>post('/admin/ui/keys/remove',{pool:currentPool,key_id:id}).then(()=>toast('Account removed','ok')).catch(e=>toast(e.message,'err')));
  }
}
function addKeysModal(){
  modal('Add accounts',`<div class="field"><label>Paste credentials — one per line or comma separated</label>
    <textarea id="keysInput" placeholder="sk-...&#10;sk-..."></textarea></div>
    <div class="note">Stored as literals in config.yaml. For very large pools, a <code class="inline">file:</code> entry in config still works.</div>`,
    btn=>post('/admin/ui/keys/add',{pool:currentPool,keys:document.querySelector('#keysInput').value}).then(r=>toast(`Added ${r.added} account(s)`,'ok')),'Add accounts');
}
async function quickAddModal(){
  let presets=[];try{presets=await api('/admin/ui/presets')}catch(e){return toast(e.message,'err')}
  modal('Quick add provider',`<div class="field"><label>Choose a provider</label><div id="presetList">
    ${presets.map(p=>`<button type="button" class="preset" data-id="${p.id}"><span class="dotmark"></span><span><span class="nm">${esc(p.name)}</span><br><span class="hint">${esc(p.base_url)}</span></span></button>`).join('')}
    </div></div><div id="presetFields" class="hidden">
    <div class="field"><label>Pool name</label><input id="qName"></div>
    <div class="field"><label>Base URL</label><input id="qBase"></div>
    <div class="field"><label>Models (comma separated — confirm current IDs in the provider's docs)</label><input id="qModels"></div>
    <div class="field"><label>API key(s) — one per line</label><textarea id="qKeys" style="min-height:80px"></textarea></div>
    <div class="note" id="qNote"></div></div>`,
    btn=>{
      if(btn.querySelector('#presetFields').classList.contains('hidden'))throw new Error('Select a provider first');
      return post('/admin/ui/pools',{
        name:btn.querySelector('#qName').value.trim(),provider:btn.querySelector('#qProvider')?.value||'openai',
        base_url:btn.querySelector('#qBase').value.trim(),
        models:btn.querySelector('#qModels').value.split(',').map(s=>s.trim()).filter(Boolean),
        keys:btn.querySelector('#qKeys').value
      }).then(()=>toast('Provider pool created — add a route in Endpoints','ok'));
    },'Create pool');
  const body=document.querySelector('#modalBody');
  body.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{
    const p=presets.find(x=>x.id===b.dataset.id);
    body.querySelector('#presetFields').classList.remove('hidden');
    let hidden=body.querySelector('#qProvider');
    if(!hidden){hidden=document.createElement('input');hidden.type='hidden';hidden.id='qProvider';body.appendChild(hidden)}
    hidden.value=p.provider;
    body.querySelector('#qName').value=p.id;
    body.querySelector('#qBase').value=p.base_url;
    body.querySelector('#qModels').value=p.models.join(', ');
    body.querySelector('#qKeys').placeholder=p.key_hint;
    body.querySelector('#qNote').textContent=p.note;
  });
}
function wireDrag(){
  const rows=document.querySelectorAll('#keyRows tr');let dragged=null;
  rows.forEach(r=>{
    r.addEventListener('dragstart',()=>{dragged=r;r.classList.add('dragging')});
    r.addEventListener('dragend',()=>{r.classList.remove('dragging');rows.forEach(x=>x.classList.remove('dragover'))});
    r.addEventListener('dragover',e=>{e.preventDefault();if(r!==dragged)r.classList.add('dragover')});
    r.addEventListener('dragleave',()=>r.classList.remove('dragover'));
    r.addEventListener('drop',e=>{e.preventDefault();r.classList.remove('dragover');if(!dragged||r===dragged)return;
      const o=S.pools.find(p=>p.name===currentPool).keys.map(k=>k.id),from=o.indexOf(dragged.dataset.id),to=o.indexOf(r.dataset.id);
      o.splice(to,0,o.splice(from,1)[0]);
      post('/admin/ui/keys/reorder',{pool:currentPool,order:o}).then(refresh).catch(x=>toast(x.message,'err'));
    });
  });
}

function renderEndpoints(){
  let h=`<div class="card"><h2>Model routes <button class="btn sm primary" id="newRoute">${icon('plus')} New route</button></h2>
  <div class="note">An alias maps the model name your agents request to one pool or an ordered failover list. Unlisted models match against each pool's model list.</div>
  <div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Alias</th><th>Failover order</th><th>Upstream override</th><th style="text-align:right">Actions</th></tr></thead><tbody>`;
  Object.entries(S.routes).forEach(([a,r])=>{h+=`<tr><td><b>${esc(a)}</b></td><td>${r.pools.map(p=>`<span class="chip">${esc(p)}</span>`).join('<span style="color:var(--muted)">→</span>')}</td>
    <td class="mono">${esc(r.model||'—')}</td><td><div class="actions">
    <button class="btn icon quiet" data-edit="${esc(a)}" title="Edit" aria-label="Edit">${icon('edit')}</button>
    <button class="btn icon quiet danger" data-del="${esc(a)}" title="Delete" aria-label="Delete">${icon('trash')}</button></div></td></tr>`});
  h+=`</tbody></table></div></div>`;
  $('#view-endpoints').innerHTML=h;
  $('#newRoute').onclick=()=>routeModal();
  $('#view-endpoints').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>routeModal(b.dataset.edit));
  $('#view-endpoints').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmModal('Delete route',`Remove alias ${b.dataset.del}?`,btn=>post('/admin/ui/routes/delete',{alias:b.dataset.del})));
}
function routeModal(alias){
  const cur=alias?S.routes[alias]:{pools:[S.pools[0]?.name].filter(Boolean),model:''};
  modal(alias?'Edit route':'New route',`<div class="field"><label>Model alias (what your agent requests)</label><input id="rAlias" value="${esc(alias||'')}" ${alias?'disabled':''} placeholder="e.g. auto"></div>
   <div class="field"><label>Select pools — arrows set failover order</label><div id="rPools">
   ${S.pools.map(p=>`<div class="preset" data-name="${esc(p.name)}" style="margin-bottom:5px">
     <input type="checkbox" class="rCheck" style="width:auto" ${cur.pools.includes(p.name)?'checked':''}>
     <span style="flex:1"><b style="font-size:12px">${esc(p.name)}</b> <span class="provider ${p.provider}">${p.provider}</span></span>
     <button type="button" class="btn icon quiet" data-move="-1" aria-label="Move up">${icon('up')}</button>
     <button type="button" class="btn icon quiet" data-move="1" aria-label="Move down">${icon('down')}</button></div>`).join('')}</div></div>
   <div class="field"><label>Upstream model override (optional)</label><input id="rModel" value="${esc(cur.model||'')}" placeholder="blank = use requested model"></div>`,
   btn=>post('/admin/ui/routes',{alias:btn.querySelector('#rAlias').value.trim(),
     pools:[...btn.querySelectorAll('.preset')].filter(r=>r.querySelector('.rCheck').checked).map(r=>r.dataset.name),
     model:btn.querySelector('#rModel').value.trim()}));
  document.querySelectorAll('#rPools [data-move]').forEach(b=>b.onclick=()=>{
    const row=b.closest('.preset'),p=row.parentNode,d=+b.dataset.move;
    if(d<0&&row.previousElementSibling)p.insertBefore(row,row.previousElementSibling);
    if(d>0&&row.nextElementSibling)p.insertBefore(row.nextElementSibling,row);
  });
}

function renderTokens(){
  let h='<div class="grid g2">';
  [['client','Client API tokens','Sent as Authorization: Bearer … by your agents'],['admin','Admin tokens','This dashboard and all /admin/* endpoints']].forEach(([k,title,desc])=>{
    h+=`<div class="card"><h2>${title} <button class="btn sm primary" data-mint="${k}">${icon('plus')} Create</button></h2><p class="sub" style="margin-bottom:12px">${esc(desc)}</p>`;
    const list=S.tokens[k];
    h+=list.length?`<div class="tablewrap"><table><thead><tr><th>ID</th><th>Token</th><th></th></tr></thead><tbody>`+list.map(t=>`<tr><td class="mono">${esc(t.id)}</td><td class="mono">${esc(t.masked)}</td>
      <td><button class="btn icon quiet danger" data-revoke="${k}" data-id="${t.id}" title="Revoke" aria-label="Revoke">${icon('trash')}</button></td></tr>`).join('')+`</tbody></table></div>`:`<div class="empty"><b>No tokens</b>Create one to authenticate clients or admins.</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;$('#view-tokens').innerHTML=h;
  $('#view-tokens').querySelectorAll('[data-mint]').forEach(b=>b.onclick=()=>tokenModal(b.dataset.mint));
  $('#view-tokens').querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>confirmModal('Revoke token','Clients using it will receive 401 immediately.',btn=>post('/admin/ui/tokens/delete',{kind:b.dataset.revoke,token:b.dataset.id})));
}
function tokenModal(kind){
  modal(`Create ${kind==='client'?'client':'admin'} token`,`<div class="field"><label>Custom token (optional — blank generates one)</label><input id="tVal" placeholder="auto-generated if blank"></div>`,
    btn=>post('/admin/ui/tokens',{kind,token:btn.querySelector('#tVal').value.trim()||null}).then(r=>{
      $('#modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h2>Token created</h2>
      <p class="sub">Copy it now — the list stores only a masked version.</p><div class="field"><input id="newTok" readonly value="${esc(r.token)}"></div>
      <div class="modal-foot"><button class="btn" id="copyTok">${icon('copy')} Copy</button><button class="btn primary" id="tokDone">Done</button></div></div></div>`;
      $('#copyTok').onclick=()=>{$('#newTok').select();navigator.clipboard.writeText(r.token).then(()=>toast('Copied to clipboard','ok')).catch(()=>toast('Select and copy manually'))};
      $('#tokDone').onclick=()=>{$('#modalRoot').innerHTML='';refresh()};
    }),'Create');
}

function renderSettings(){
  const s=S.server;
  const f=(id,label,val,type='text')=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`;
  $('#view-settings').innerHTML=`<div class="grid g2">
    <div class="card"><h2>Server</h2>${f('s_host','Bind host',s.host)}${f('s_port','Port',s.port,'number')}${f('s_timeout','Request timeout (seconds)',s.request_timeout,'number')}
    <div class="field"><label for="s_log">Log level</label><select id="s_log">${['DEBUG','INFO','WARNING','ERROR'].map(x=>`<option ${x===s.log_level?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="card"><h2>Routing</h2>${f('s_retries','Max account attempts per request',s.max_retries,'number')}
    <div class="field"><label for="s_sel">Selection strategy</label><select id="s_sel">${['least_used','round_robin','random'].map(x=>`<option value="${x}" ${x===s.selection?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="note">Host and port require a restart. Everything else is applied immediately.</div></div></div>
    <div class="card" style="margin-top:14px"><h2>Cooldowns <span style="color:var(--muted);font-weight:400;font-size:11px">seconds</span></h2><div class="grid g4">
    ${Object.entries(s.cooldown).map(([k,v])=>f('cd_'+k,k.replace(/_/g,' '),v,'number')).join('')}</div></div>
    <div style="margin-top:16px"><button class="btn primary" id="saveSettings">Save & apply</button></div>`;
  $('#saveSettings').onclick=e=>{
    const cd={};Object.keys(S.server.cooldown).forEach(k=>cd[k]=parseFloat(document.getElementById('cd_'+k).value));
    busy(e.currentTarget,true);
    post('/admin/ui/settings',{host:document.getElementById('s_host').value,port:parseInt(document.getElementById('s_port').value),
      request_timeout:parseFloat(document.getElementById('s_timeout').value),log_level:document.getElementById('s_log').value,
      max_retries:parseInt(document.getElementById('s_retries').value),selection:document.getElementById('s_sel').value,cooldown:cd})
      .then(()=>toast('Settings saved and applied','ok')).catch(x=>toast(x.message,'err')).finally(()=>busy(e.currentTarget,false));
  };
}
function renderRemote(){
  const port=S.server.port,host=location.hostname;
  $('#view-remote').innerHTML=`<div class="grid g2">
   <div class="card"><h2>Connect from another device</h2><p class="sub">Gateway binds to <b>${esc(S.server.host)}</b>. While this device is on, use:</p>
    <div class="field"><label>OpenAI-compatible base URL</label><input readonly value="http://${esc(host)}:${port}/v1"></div>
    <div class="field"><label>Claude Code base URL (no /v1)</label><input readonly value="http://${esc(host)}:${port}"></div>
    <div class="note">Works on the same Wi‑Fi. For internet access use a tunnel (Cloudflare Tunnel, Tailscale, ngrok) or port-forward, and put TLS in front. Never expose the dashboard without a strong admin token.</div></div>
   <div class="card"><h2>Agent snippets</h2>
    <div class="field"><label>Claude Code</label><div class="codeblock">export ANTHROPIC_BASE_URL="http://${esc(host)}:${port}"
export ANTHROPIC_AUTH_TOKEN="&lt;client token&gt;"
export ANTHROPIC_MODEL="claude-opus-5-5"
claude</div></div>
    <div class="field"><label>OpenAI client / OpenCode</label><div class="codeblock">base_url = "http://${esc(host)}:${port}/v1"
api_key = "&lt;client token&gt;"</div></div></div></div>`;
}

/* Modal helper: Esc closes; focus first field */
function modal(title,html,onConfirm,label='Save'){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay" data-starting-style><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2><div id="modalBody">${html}</div>
    <div class="modal-foot"><button class="btn quiet" id="mCancel">Cancel</button><button class="btn primary" id="mOk">${esc(label)}</button></div></div></div>`;
  requestAnimationFrame(()=>root.querySelector('.overlay').removeAttribute('data-starting-style'));
  const close=()=>{const o=root.querySelector('.overlay');if(!o)return;o.setAttribute('data-ending-style','');setTimeout(()=>root.innerHTML='',190)};
  root.querySelector('#mCancel').onclick=close;
  root.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}};
  const first=root.querySelector('#modalBody input,#modalBody textarea');if(first)setTimeout(()=>first.focus(),60);
  root.querySelector('#mOk').onclick=async e=>{
    busy(e.currentTarget,true);
    try{await onConfirm(root.querySelector('#modalBody'));close();await refresh()}
    catch(err){toast(err.message,'err');busy(e.currentTarget,false)}
  };
}
function confirmModal(title,text,onYes){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay" data-starting-style><div class="modal" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2><p class="sub">${esc(text)}</p>
    <div class="modal-foot"><button class="btn quiet" id="mCancel">Cancel</button><button class="btn danger" id="mOk">Confirm</button></div></div></div>`;
  requestAnimationFrame(()=>root.querySelector('.overlay').removeAttribute('data-starting-style'));
  const close=()=>{const o=root.querySelector('.overlay');if(!o)return;o.setAttribute('data-ending-style','');setTimeout(()=>root.innerHTML='',190)};
  root.querySelector('#mCancel').onclick=close;
  root.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}};
  root.querySelector('#mOk').onclick=async e=>{busy(e.currentTarget,true);try{await onYes(e.currentTarget);close();await refresh()}catch(err){toast(err.message,'err');busy(e.currentTarget,false)}};
}

$('#loginForm').onsubmit=e=>{e.preventDefault();token=$('#loginToken').value.trim();if(token)refresh()};
$('#refreshBtn').onclick=e=>{busy(e.currentTarget,true);refresh().finally(()=>busy(e.currentTarget,false))};
$('#reloadBtn').onclick=e=>doReload(e.currentTarget);
if(token)refresh();else showLock();
</script>
