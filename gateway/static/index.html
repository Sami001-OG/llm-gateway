<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Gateway · Control Center</title>
<style>
:root{
  --bg:#080d1a; --bg2:#0d1424; --card:#131c30; --card2:#18223a;
  --line:#253252; --text:#e8eefc; --muted:#8b9bc0; --dim:#5f7096;
  --accent:#6d8bff; --accent2:#38d6c4; --danger:#ff6b81; --warn:#ffc46b; --ok:#4ade9b;
  --shadow:0 18px 50px rgba(0,0,0,.38); --r:16px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 600px at 85% -10%,#1b2a55 0%,transparent 60%),radial-gradient(800px 500px at -10% 100%,#0d3a3a 0%,transparent 55%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(4,8,18,.88);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{width:min(420px,92vw);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:var(--shadow)}
.login-card h1{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}
.login-card p{color:var(--muted);margin:0 0 24px}
.app{display:flex;min-height:100vh}
.sidebar{width:232px;flex:0 0 232px;background:rgba(10,16,30,.75);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 26px;font-weight:700;font-size:16px;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:18px;box-shadow:0 6px 18px rgba(109,139,255,.35)}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border:0;border-radius:11px;background:transparent;color:var(--muted);text-align:left;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav button.active{background:linear-gradient(90deg,rgba(109,139,255,.22),rgba(109,139,255,.05));color:#fff;box-shadow:inset 2px 0 var(--accent)}
.nav .ico{width:20px;text-align:center;font-size:16px}
.side-foot{position:absolute;bottom:18px;left:14px;right:14px;color:var(--dim);font-size:11px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1500px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:26px;letter-spacing:-.6px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.btn{border:1px solid var(--line);background:var(--card2);padding:9px 15px;border-radius:10px;color:var(--text);font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5570e8);border-color:transparent;box-shadow:0 6px 18px rgba(109,139,255,.28)}
.btn.teal{background:linear-gradient(135deg,var(--accent2),#1aa597);border-color:transparent;color:#04231f}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(255,107,129,.35)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.icon{padding:6px 9px;font-size:13px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{display:none}main{padding:18px}.g4{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 16px;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;justify-content:space-between}
.stat{position:relative;overflow:hidden}
.stat .num{font-size:31px;font-weight:750;letter-spacing:-1px}
.stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.stat .glow{position:absolute;right:-22px;top:-22px;width:90px;height:90px;border-radius:50%;filter:blur(20px);opacity:.35;background:var(--accent)}
.stat:nth-child(2) .glow{background:var(--ok)}.stat:nth-child(3) .glow{background:var(--warn)}.stat:nth-child(4) .glow{background:var(--danger)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;gap:12px;flex-wrap:wrap}
.section-head h3{margin:0;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600}
.tab.active{color:#fff;border-color:var(--accent);background:rgba(109,139,255,.16)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid rgba(37,50,82,.5);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.dragging{opacity:.4}
tr.dragover td{border-top:2px solid var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge.ok{color:var(--ok);background:rgba(74,222,155,.1);border-color:rgba(74,222,155,.25)}
.badge.cool{color:var(--warn);background:rgba(255,196,107,.1);border-color:rgba(255,196,107,.25)}
.badge.off{color:var(--danger);background:rgba(255,107,129,.1);border-color:rgba(255,107,129,.25)}
.badge.neutral{color:var(--muted);background:rgba(139,155,192,.1);border-color:rgba(139,155,192,.2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;background:rgba(109,139,255,.13);border:1px solid rgba(109,139,255,.28);font-size:12px;font-weight:600;margin:2px}
.actions{display:flex;gap:5px;justify-content:flex-end}
.handle{cursor:grab;color:var(--dim);font-size:15px;user-select:none;padding:0 6px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1px dashed var(--line);border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{background:#0b1324;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,139,255,.12)}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.modal-card{width:min(560px,94vw);max-height:88vh;overflow:auto;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.modal-card h3{margin:0 0 18px;font-size:18px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast div{padding:12px 17px;border-radius:11px;background:#1a2742;border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;animation:slide .2s ease}
.toast div.err{border-color:rgba(255,107,129,.5);color:#ffd7dd}
.toast div.ok{border-color:rgba(74,222,155,.45);color:#d3ffe9}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.copy{cursor:pointer}
.copy:hover{color:var(--accent2)}
.note{font-size:12px;color:var(--muted);background:rgba(109,139,255,.07);border-left:2px solid var(--accent);padding:10px 13px;border-radius:0 8px 8px 0;margin-top:12px}
code.inline{background:rgba(109,139,255,.12);padding:2px 6px;border-radius:5px;font-size:12px}
.pool-card{cursor:pointer;transition:.15s}
.pool-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.pool-card h4{margin:0 0 6px;font-size:14px}
.pool-card .meta{color:var(--muted);font-size:12px}
.provider{font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:2px 8px;border-radius:99px;background:rgba(56,214,196,.12);color:var(--accent2);border:1px solid rgba(56,214,196,.25)}
.provider.anthropic{background:rgba(255,196,107,.1);color:var(--warn);border-color:rgba(255,196,107,.25)}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login" class="overlay">
  <form class="login-card" id="loginForm">
    <div class="logo" style="margin-bottom:18px">◆</div>
    <h1>Gateway Control Center</h1>
    <p>Enter an <b>admin token</b> from <code class="inline">server.admin_tokens</code> to continue.</p>
    <div class="field"><label>Admin token</label><input id="loginToken" type="password" autocomplete="current-password" placeholder="change-me-admin-token" autofocus></div>
    <button class="btn primary" style="width:100%" type="submit">Unlock dashboard</button>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="logo">◆</span><span>LLM Gateway</span></div>
    <div class="nav" id="nav">
      <button data-view="overview" class="active"><span class="ico">▦</span> Overview</button>
      <button data-view="accounts"><span class="ico">🔑</span> Accounts</button>
      <button data-view="endpoints"><span class="ico">⇄</span> Endpoints</button>
      <button data-view="tokens"><span class="ico">🛡</span> API Tokens</button>
      <button data-view="settings"><span class="ico">⚙</span> Settings</button>
      <button data-view="remote"><span class="ico">🌐</span> Remote access</button>
    </div>
    <div class="side-foot"><b id="sidePools">–</b> pools · <b id="sideKeys">–</b> accounts<br><span id="sidePath"></span></div>
  </aside>

  <main>
    <div class="topbar">
      <div><h2 id="pageTitle">Overview</h2><div class="sub" id="pageSub">Live status of your account pool</div></div>
      <div style="display:flex;gap:9px">
        <button class="btn ghost" onclick="doReload()">↻ Reload from disk</button>
        <button class="btn primary" onclick="refresh()">Refresh data</button>
      </div>
    </div>

    <section id="view-overview"></section>
    <section id="view-accounts" class="hidden"></section>
    <section id="view-endpoints" class="hidden"></section>
    <section id="view-tokens" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
    <section id="view-remote" class="hidden"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const TITLES={
  overview:['Overview','Live status of your account pool'],
  accounts:['Accounts','Add, order and manage every credential'],
  endpoints:['Endpoints','Choose which pools serve each model alias'],
  tokens:['API Tokens','Create keys for clients and administrators'],
  settings:['Settings','Gateway behaviour and cooldown tuning'],
  remote:['Remote access','Use the gateway from another device']
};
let token=localStorage.getItem('gw_admin_token')||'';
let S=null, view='overview', currentPool=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg,type=''){
  const d=document.createElement('div'); d.className=type; d.textContent=msg;
  $('#toast').appendChild(d); setTimeout(()=>d.remove(),4200);
}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}});
  if(r.status===401){showLogin();throw new Error('Session expired');}
  let j; try{j=await r.json();}catch{j={};}
  if(!r.ok||j.ok===false) throw new Error(j.error||('Request failed ('+r.status+')'));
  return j.data;
}
async function post(path,body){return api(path,{method:'POST',body:JSON.stringify(body||{})});}
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }
async function refresh(){
  try{
    S=await api('/admin/ui/state');
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    localStorage.setItem('gw_admin_token',token);
    if(!currentPool||!S.pools.some(p=>p.name===currentPool)) currentPool=S.pools[0]?.name||null;
    renderAll();
  }catch(e){ if(e.message!=='Session expired') toast(e.message,'err'); }
}
function doReload(){ post('/admin/ui/reload').then(()=>{toast('Reloaded from disk','ok');refresh();}).catch(e=>toast(e.message,'err')); }

function modal(title,body,onConfirm,label='Save'){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay"><div class="modal-card"><h3>${esc(title)}</h3><div id="modalBody">${body}</div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mOk">${esc(label)}</button></div></div></div>`;
  $('#mCancel').onclick=()=>root.innerHTML='';
  $('#mOk').onclick=async()=>{try{await onConfirm($('#modalBody'));root.innerHTML='';refresh();}catch(e){toast(e.message,'err');}};
}
function confirmModal(title,text,onYes){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay"><div class="modal-card"><h3>${esc(title)}</h3><p style="color:var(--muted)">${esc(text)}</p>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn danger" id="mOk">Confirm</button></div></div></div>`;
  $('#mCancel').onclick=()=>root.innerHTML='';
  $('#mOk').onclick=async()=>{try{await onYes();root.innerHTML='';refresh();}catch(e){toast(e.message,'err');}};
}

function navTo(v){ view=v; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  ['overview','accounts','endpoints','tokens','settings','remote'].forEach(x=>$('#view-'+x).classList.toggle('hidden',x!==v));
  $('#pageTitle').textContent=TITLES[v][0]; $('#pageSub').textContent=TITLES[v][1]; renderAll(); }
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>navTo(b.dataset.view));

function renderAll(){ if(!S)return;
  $('#sidePools').textContent=S.pools.length; $('#sideKeys').textContent=S.stats.keys; $('#sidePath').textContent=S.server.config_path;
  renderOverview(); renderAccounts(); renderEndpoints(); renderTokens(); renderSettings(); renderRemote();
}
function badge(k){ if(k.disabled)return '<span class="badge off">disabled</span>';
  if(!k.available&&k.cooldown_remaining>0)return '<span class="badge cool">cooling '+k.cooldown_remaining+'s</span>';
  return '<span class="badge ok">ready</span>'; }

function renderOverview(){
  const st=S.stats;
  let h=`<div class="grid g4">
    <div class="card stat"><div class="glow"></div><div class="num">${st.keys}</div><div class="lbl">Total accounts</div></div>
    <div class="card stat"><div class="glow"></div><div class="num">${st.available}</div><div class="lbl">Available now</div></div>
    <div class="card stat"><div class="glow"></div><div class="num">${st.cooling_down}</div><div class="lbl">Cooling down</div></div>
    <div class="card stat"><div class="glow"></div><div class="num">${st.requests}</div><div class="lbl">Requests routed</div></div>
  </div>
  <div class="section-head"><h3>Pools</h3><button class="btn sm" onclick="navTo('accounts')">Manage accounts →</button></div>
  <div class="grid g3">`;
  S.pools.forEach(p=>{
    const avail=p.keys.filter(k=>k.available&&!k.disabled).length;
    h+=`<div class="card pool-card" onclick="pickPool('${esc(p.name)}')"><h4>${esc(p.name)} <span class="provider ${p.provider}">${p.provider}</span></h4>
      <div class="meta">${p.keys.length} accounts · ${avail} ready · ${p.models.length} models</div>
      <div style="margin-top:12px;height:5px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden">
      <div style="height:100%;width:${p.keys.length?Math.round(avail/p.keys.length*100):0}%;background:linear-gradient(90deg,var(--ok),var(--accent2))"></div></div></div>`;
  });
  h+=`</div><div class="section-head"><h3>Endpoints</h3><button class="btn sm" onclick="navTo('endpoints')">Edit routes →</button></div><div class="card"><table>
    <tr><th>Model alias</th><th>Served by (in order)</th><th>Upstream model</th></tr>`;
  Object.entries(S.routes).forEach(([alias,r])=>{
    h+=`<tr><td><b>${esc(alias)}</b></td><td>${r.pools.map(p=>`<span class="chip">${esc(p)}</span>`).join('→')}</td><td class="mono">${esc(r.model||'auto')}</td></tr>`;
  });
  h+=`</table></div>`;
  $('#view-overview').innerHTML=h;
}
function pickPool(n){currentPool=n;navTo('accounts');}

function renderAccounts(){
  const p=S.pools.find(x=>x.name===currentPool);
  let h=`<div class="tabs">${S.pools.map(x=>`<button class="tab ${x.name===currentPool?'active':''}" onclick="pickPool('${esc(x.name)}')">${esc(x.name)} <span style="opacity:.6">(${x.keys.length})</span></button>`).join('')}</div>`;
  h+=`<div class="card"><h3>Accounts in <span style="color:var(--accent2)">${esc(currentPool||'—')}</span>
    <button class="btn sm primary" onclick="addKeysModal()">+ Add accounts</button></h3>`;
  if(!p){ h+='<div class="empty">No pool selected. Create one in Settings or config.yaml.</div>'; }
  else{
    h+=`<table><thead><tr><th style="width:40px"></th><th>Credential</th><th>Status</th><th>Requests</th><th>OK / Fail</th><th style="text-align:right">Actions</th></tr></thead><tbody id="keyRows">`;
    p.keys.forEach(k=>{
      h+=`<tr draggable="true" data-id="${esc(k.id)}"><td class="handle" title="Drag to reorder">⠿</td>
        <td class="mono">${esc(k.masked)}</td><td>${badge(k)}</td><td>${k.total_requests}</td>
        <td><span style="color:var(--ok)">${k.total_successes}</span> / <span style="color:var(--danger)">${k.total_failures}</span></td>
        <td><div class="actions">
          <button class="btn icon ghost" title="Move up" onclick="moveKey('${esc(k.id)}',-1)">↑</button>
          <button class="btn icon ghost" title="Move down" onclick="moveKey('${esc(k.id)}',1)">↓</button>
          <button class="btn icon ghost" title="${k.disabled?'Enable':'Disable'}" onclick="toggleKey('${esc(k.id)}',${!k.disabled})">${k.disabled?'✓':'⊘'}</button>
          <button class="btn icon ghost danger" title="Remove" onclick="removeKey('${esc(k.id)}')">✕</button>
        </div></td></tr>`;
    });
    h+=`</tbody></table><div class="note">Drag rows or use ↑ ↓ to set priority. Selection strategy <b>${esc(p.selection)}</b> decides how traffic is spread; disabled/cooling accounts are skipped automatically.</div>`;
  }
  h+=`</div>`;
  $('#view-accounts').innerHTML=h;
  wireDrag();
}
function addKeysModal(){
  modal('Add accounts to '+currentPool,`<div class="field"><label>Paste keys — one per line (or comma separated)</label>
    <textarea id="keysInput" placeholder="sk-...&#10;sk-..."></textarea></div>
    <div class="note">Keys are stored as literals in config.yaml. For very large pools you can still use <code class="inline">file:</code> entries directly in the config.</div>`,
    b=>post('/admin/ui/keys/add',{pool:currentPool,keys:b.querySelector('#keysInput').value}).then(r=>toast('Added '+r.added+' account(s)','ok')),'Add accounts');
}
function currentOrder(){return S.pools.find(p=>p.name===currentPool).keys.map(k=>k.id);}
function moveKey(id,dir){
  const order=currentOrder(), i=order.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=order.length)return;
  [order[i],order[j]]=[order[j],order[i]];
  post('/admin/ui/keys/reorder',{pool:currentPool,order}).then(()=>refresh()).catch(e=>toast(e.message,'err'));
}
function toggleKey(id,disabled){
  post('/admin/ui/keys/toggle',{pool:currentPool,key_id:id,disabled}).then(()=>toast(disabled?'Account disabled':'Account enabled','ok')).catch(e=>toast(e.message,'err'));
}
function removeKey(id){confirmModal('Remove account','This removes the credential from config.yaml.',()=>post('/admin/ui/keys/remove',{pool:currentPool,key_id:id}).then(()=>toast('Removed','ok')));}
function wireDrag(){
  const rows=document.querySelectorAll('#keyRows tr'); let dragged=null;
  rows.forEach(r=>{
    r.addEventListener('dragstart',()=>{dragged=r;r.classList.add('dragging');});
    r.addEventListener('dragend',()=>{r.classList.remove('dragging');rows.forEach(x=>x.classList.remove('dragover'));});
    r.addEventListener('dragover',e=>{e.preventDefault();if(r!==dragged)r.classList.add('dragover');});
    r.addEventListener('dragleave',()=>r.classList.remove('dragover'));
    r.addEventListener('drop',e=>{e.preventDefault();r.classList.remove('dragover');
      if(!dragged||r===dragged)return;
      const order=currentOrder(), from=order.indexOf(dragged.dataset.id), to=order.indexOf(r.dataset.id);
      order.splice(to,0,order.splice(from,1)[0]);
      post('/admin/ui/keys/reorder',{pool:currentPool,order}).then(()=>refresh()).catch(x=>toast(x.message,'err'));
    });
  });
}

function renderEndpoints(){
  let h=`<div class="card"><h3>Model routes <button class="btn sm primary" onclick="routeModal()">+ New route</button></h3>
   <div class="note">A route maps the model name your agents request to one pool, or an ordered failover list across pools. Unlisted models are matched against each pool's model list.</div>
   <table style="margin-top:16px"><thead><tr><th>Alias</th><th>Failover order</th><th>Upstream model override</th><th style="text-align:right">Actions</th></tr></thead><tbody>`;
  Object.entries(S.routes).forEach(([alias,r])=>{
    h+=`<tr><td><b>${esc(alias)}</b></td><td>${r.pools.map(p=>`<span class="chip">${esc(p)}</span>`).join('<span style="color:var(--dim)">→</span>')}</td>
      <td class="mono">${esc(r.model||'—')}</td><td><div class="actions">
      <button class="btn sm ghost" onclick="routeModal('${esc(alias)}')">Edit</button>
      <button class="btn sm ghost danger" onclick="deleteRoute('${esc(alias)}')">Delete</button></div></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  $('#view-endpoints').innerHTML=h;
}
function routeModal(alias){
  const cur=alias?S.routes[alias]:{pools:[S.pools[0]?.name].filter(Boolean),model:''};
  const body=`<div class="field"><label>Model alias (what your agent requests)</label><input id="rAlias" value="${esc(alias||'')}" ${alias?'disabled':''} placeholder="e.g. auto"></div>
   <div class="field"><label>Select pools — use ↑ ↓ to set failover order</label><div id="rPools">`+
   S.pools.map(p=>{const on=cur.pools.includes(p.name);return `<div class="poolRow" data-name="${esc(p.name)}" style="display:flex;align-items:center;gap:9px;padding:7px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px">
     <input type="checkbox" class="rCheck" ${on?'checked':''} style="width:auto">
     <span style="flex:1">${esc(p.name)} <span class="provider ${p.provider}">${p.provider}</span></span>
     <button type="button" class="btn sm ghost" onclick="poolMove(this,-1)">↑</button>
     <button type="button" class="btn sm ghost" onclick="poolMove(this,1)">↓</button></div>`;}).join('')+`</div></div>
   <div class="field"><label>Upstream model override (optional)</label><input id="rModel" value="${esc(cur.model||'')}" placeholder="leave blank to use the requested model"></div>`;
  modal(alias?'Edit route '+alias:'New route',body,b=>{
    const name=b.querySelector('#rAlias').value.trim();
    const pools=[...b.querySelectorAll('.poolRow')].filter(r=>r.querySelector('.rCheck').checked).map(r=>r.dataset.name);
    return post('/admin/ui/routes',{alias:name,pools,model:b.querySelector('#rModel').value.trim()});
  });
}
function poolMove(btn,dir){
  const row=btn.closest('.poolRow'), parent=row.parentNode;
  if(dir<0&&row.previousElementSibling)parent.insertBefore(row,row.previousElementSibling);
  if(dir>0&&row.nextElementSibling)parent.insertBefore(row.nextElementSibling,row);
}
function deleteRoute(a){confirmModal('Delete route','Remove alias '+a+'?',()=>post('/admin/ui/routes/delete',{alias:a}));}

function renderTokens(){
  let h='<div class="grid g2">';
  [['client','Client API tokens','Used by agents in Authorization: Bearer …'],['admin','Admin tokens','Used for this dashboard and /admin/*']].forEach(([kind,title,desc])=>{
    h+=`<div class="card"><h3>${title} <button class="btn sm primary" onclick="tokenModal('${kind}')">+ Create</button></h3><div class="sub" style="margin-bottom:12px">${desc}</div>`;
    const list=S.tokens[kind];
    h+=list.length?`<table><tr><th>ID</th><th>Token</th><th></th></tr>`+list.map(t=>`<tr><td class="mono">${esc(t.id)}</td><td class="mono">${esc(t.masked)}</td>
      <td><button class="btn sm ghost danger" onclick="revokeToken('${kind}','${t.id}')">Revoke</button></td></tr>`).join('')+`</table>`:'<div class="empty">No tokens</div>';
    h+='</div>';
  });
  h+='</div>';
  $('#view-tokens').innerHTML=h;
}
function tokenModal(kind){
  modal('Create '+(kind==='client'?'client':'admin')+' token',`<div class="field"><label>Custom token (optional — leave blank to generate)</label><input id="tVal" placeholder="auto-generated if empty"></div>`,
   b=>post('/admin/ui/tokens',{kind,token:b.querySelector('#tVal').value.trim()||null}).then(r=>{
     const root=$('#modalRoot');
     root.innerHTML=`<div class="overlay"><div class="modal-card"><h3>Token created</h3>
       <p style="color:var(--muted)">Copy this now — it is shown only once (the list stores it masked).</p>
       <div class="field"><input id="newTok" readonly value="${esc(r.token)}"></div>
       <div class="modal-foot"><button class="btn" onclick="copyTok()">Copy</button><button class="btn primary" onclick="document.getElementById('modalRoot').innerHTML='';refresh()">Done</button></div></div></div>`;
   }),'Create');
}
function copyTok(){const el=$('#newTok');el.select();navigator.clipboard.writeText(el.value).then(()=>toast('Copied','ok')).catch(()=>toast('Select and copy manually'));}
function revokeToken(kind,id){confirmModal('Revoke token','Any agent using it will get 401 immediately.',()=>post('/admin/ui/tokens/delete',{kind,token:id}).then(()=>toast('Revoked','ok')));}

function renderSettings(){
  const s=S.server;
  const inp=(id,label,val,type='text')=>`<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val)}"></div>`;
  let h=`<div class="grid g2"><div class="card"><h3>Server</h3>
    ${inp('s_host','Bind host',s.host)}${inp('s_port','Port',s.port,'number')}
    ${inp('s_timeout','Request timeout (seconds)',s.request_timeout,'number')}
    <div class="field"><label>Log level</label><select id="s_log">${['DEBUG','INFO','WARNING','ERROR'].map(x=>`<option ${x===s.log_level?'selected':''}>${x}</option>`).join('')}</select></div>
    </div><div class="card"><h3>Routing</h3>
    ${inp('s_retries','Max account attempts per request',s.max_retries,'number')}
    <div class="field"><label>Selection strategy</label><select id="s_sel">${['least_used','round_robin','random'].map(x=>`<option value="${x}" ${x===s.selection?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="note">Changes to host/port require a restart. Everything else applies immediately.</div></div></div>
    <div class="card" style="margin-top:16px"><h3>Cooldowns (seconds)</h3><div class="grid g4">
    ${Object.entries(s.cooldown).map(([k,v])=>inp('cd_'+k,k.replace('_',' '),v,'number')).join('')}</div></div>
    <div style="margin-top:16px"><button class="btn primary" onclick="saveSettings()">Save & apply settings</button></div>`;
  $('#view-settings').innerHTML=h;
}
function saveSettings(){
  const cd={}; Object.keys(S.server.cooldown).forEach(k=>cd[k]=parseFloat(document.getElementById('cd_'+k).value));
  post('/admin/ui/settings',{host:document.getElementById('s_host').value,port:parseInt(document.getElementById('s_port').value),
    request_timeout:parseFloat(document.getElementById('s_timeout').value),log_level:document.getElementById('s_log').value,
    max_retries:parseInt(document.getElementById('s_retries').value),selection:document.getElementById('s_sel').value,cooldown:cd})
    .then(()=>toast('Settings saved & applied','ok')).catch(e=>toast(e.message,'err'));
}

function renderRemote(){
  const port=S.server.port, host=location.hostname;
  $('#view-remote').innerHTML=`<div class="grid g2"><div class="card"><h3>Connect from another device</h3>
    <p style="color:var(--muted)">The gateway is bound to <b>${esc(S.server.host)}</b>. When this device is on and reachable, use:</p>
    <div class="field"><label>OpenAI-compatible base URL</label><input readonly value="http://${esc(host)}:${port}/v1"></div>
    <div class="field"><label>Claude Code base URL (no /v1)</label><input readonly value="http://${esc(host)}:${port}"></div>
    <div class="note">On the same Wi‑Fi this just works. From the internet, use a tunnel (Cloudflare Tunnel / Tailscale / ngrok) or port-forward, and put TLS in front. Never expose the admin dashboard without a strong admin token.</div>
    </div><div class="card"><h3>Agent snippets</h3>
    <div class="field"><label>Claude Code</label><textarea readonly rows="4">export ANTHROPIC_BASE_URL="http://${esc(host)}:${port}"
export ANTHROPIC_AUTH_TOKEN="&lt;your client token&gt;"
export ANTHROPIC_MODEL="claude-opus-5-5"
claude</textarea></div>
    <div class="field"><label>OpenAI client / OpenCode</label><textarea readonly rows="3">base_url = "http://${esc(host)}:${port}/v1"
api_key = "&lt;your client token&gt;"</textarea></div>
    </div></div>`;
}

$('#loginForm').onsubmit=e=>{e.preventDefault();token=$('#loginToken').value.trim();if(token)refresh();};
if(token)refresh(); else showLogin();
</script>
</body>
</html>
